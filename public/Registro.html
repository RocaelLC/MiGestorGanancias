<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="container">
        <div class="login-box">
            <h2>Registro de Usuario</h2>
            <form id="registerForm">
                <div class="input-box">
                    <input type="text" id="name" placeholder="Nombre" required>
                </div>
                <div class="input-box">
                    <input type="text" id="apellido" placeholder="Apellido" required>
                </div>
                <div class="input-box">
                    <input type="email" id="emailRegister" placeholder="Correo Electrónico" required>
                </div>
                <div class="input-box">
                    <input type="password" id="passwordRegister" placeholder="Contraseña" required>
                </div>
                <div class="input-box">
                    <!-- Selector de rol -->
                    <select id="roleSelector" required>
                        <option value="trabajador">Trabajador</option>
                        <option value="admin">Administrador</option>
                    </select>
                </div>
                <!-- Código de seguridad para Admin (oculto por defecto) -->
                <div class="input-box" id="adminCodeContainer" style="display: none;">
                    <input type="password" id="adminCode" placeholder="Código de Administrador">
                </div>
                <div class="button-box">
                    <button type="submit">Registrar</button>
                    <button onclick="window.location.href='index.html'"> Volver</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module" src="Registro.js"></script>

    <script>
        // Mostrar campo de código solo si el usuario elige "Administrador"
        document.getElementById("roleSelector").addEventListener("change", function () {
            const adminCodeContainer = document.getElementById("adminCodeContainer");
            if (this.value === "admin") {
                adminCodeContainer.style.display = "block";
            } else {
                adminCodeContainer.style.display = "none";
            }
        });
    </script>

</body>
</html>
