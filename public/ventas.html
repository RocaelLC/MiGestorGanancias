<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <div id="adminPanel">
        <title>Ventas de Productos</title>
       
    </div>
    
    
    <link rel="stylesheet" href="ventas.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    
    <!-- Scripts externos -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.all.min.js" defer></script>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js" defer></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js" defer></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js" defer></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-storage.js" defer></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <!-- Archivo JS Principal -->
    <script src="ventas.js" defer></script>
    

</head>

<body>
    <h1 class="title">Registrar venta</h1>
    <span class="back-icon fas fa-arrow-left" onclick="goBack()"></span>


    <!-- Campo de búsqueda -->
    <input type="text" id="search-bar" placeholder="Buscar productos...">

    <!-- Lista de productos -->
    <div class="product-container" id="product-list"></div>

    <!-- Icono de carrito en la parte superior derecha -->
    <div id="cart-icon" class="cart-icon">
        <img src="https://img.icons8.com/ios-filled/50/000000/shopping-cart.png" alt="Carrito">
        <span id="cart-count">0</span>
    </div>

    <!-- Carrito desplegable al hacer hover -->
    <div id="cart-popup" class="cart-popup">
        <div id="cart-items"></div>

        <button id="finalize-sale">Finalizar Venta</button>
    </div>

    <div id="ticket-container"></div>
</body>
<script src="ventas.js" defer></script>
</html>
