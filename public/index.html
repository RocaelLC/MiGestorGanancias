<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="styles.css">
     <!-- SweetAlert2 (opcional si lo vas a usar en este módulo) -->
     <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>


</head>
<body>

    <div class="container">
        <div class="login-box">
            <h2>Iniciar Sesión</h2>
            <form id="loginForm">
                <div class="input-box">
                    <input type="email" id="emailLogin" placeholder="Correo Electrónico" required>
                </div>
                <div class="input-box">
                    <input type="password" id="passwordLogin" placeholder="Contraseña" required>
                </div>
                <div class="input-box">
                    <!-- Selector de rol -->
                    <select id="roleSelector" required>
                        <option value="trabajador">Trabajador</option>
                        <option value="admin">Administrador</option>
                    </select>
                </div>
                <!-- Código de seguridad para Admin (oculto por defecto) -->
                <div class="input-box" id="adminCodeContainer" style="display: none;">
                    <input type="password" id="adminCode" placeholder="Código de Administrador">
                </div>
                <div class="button-box">
                    <button type="submit">Ingresar</button>
                    <button onclick="window.location.href='Registro.html'">Registrarte</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module" src="app.js"></script>

    <script>
        // Mostrar campo de código solo si el usuario elige "Administrador"
        document.getElementById("roleSelector").addEventListener("change", function () {
            const adminCodeContainer = document.getElementById("adminCodeContainer");
            if (this.value === "admin") {
                adminCodeContainer.style.display = "block";
            } else {
                adminCodeContainer.style.display = "none";
            }
        });
    </script>
<script type="module" src="app.js"></script>
</body>
</html>
