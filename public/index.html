<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pantalla de Inicio</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="container">
        <div class="login-box">
            <h2>Iniciar Sesión</h2>
            <form id="loginForm">
                <!-- Campo de correo -->
                <div class="input-box">
                    <input type="email" placeholder="Correo Electrónico" id="emailLogin" name="email" required>
                </div>
                <!-- Campo de contraseña -->
                <div class="input-box">
                    <input type="password" placeholder="Contraseña" id="passwordLogin" name="password" required>
                </div>
                <!-- Botones de acción -->
                <div class="button-box">
                    <button type="submit">Iniciar Sesión</button>
                    <button type="button" onclick="window.location.href='Registro.html'">Crear Cuenta</button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-auth-compat.js"></script>
    <script src="app.js"></script>
</body>

</html>
